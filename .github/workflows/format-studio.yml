name: Format studio redesign

# One-time formatting pass, restricted to this development branch and this file.
on:
  push:
    branches: [design/onyx-studio-refresh]
    paths: [.github/workflows/format-studio.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/onyx-studio-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Format only redesigned UI
        run: >-
          npx prettier --write
          src/styles.css
          src/routes/index.tsx
          src/routes/__root.tsx
          src/components/player/MediaPlayer.tsx
          src/components/player/ControlBar.tsx
          src/components/player/SourceIntake.tsx
          src/components/player/Playlist.tsx
          src/components/player/LogPanel.tsx
          src/components/player/ViewToggle.tsx
      - name: Commit only the formatting changes
        run: |
          git add -- src/styles.css src/routes/index.tsx src/routes/__root.tsx src/components/player/MediaPlayer.tsx src/components/player/ControlBar.tsx src/components/player/SourceIntake.tsx src/components/player/Playlist.tsx src/components/player/LogPanel.tsx src/components/player/ViewToggle.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format redesigned studio interface with project Prettier"
          git push origin HEAD:design/onyx-studio-refresh
